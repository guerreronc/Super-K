<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fondo redondeado oscuro -->
  <rect width="512" height="512" rx="110" fill="#0F172A"/>
  
  <g transform="translate(25, 20)">
    <!-- Carrito / Estructura principal -->
    <path d="M 80 140 L 130 140 L 170 340 L 380 340 L 410 180 L 150 180" 
          fill="none" stroke="#10B981" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Líneas de Código de Barras dentro del carrito -->
    <line x1="200" y1="210" x2="200" y2="310" stroke="#22C55E" stroke-width="16" stroke-linecap="round"/>
    <line x1="230" y1="210" x2="230" y2="310" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <line x1="260" y1="210" x2="260" y2="310" stroke="#22C55E" stroke-width="20" stroke-linecap="round"/>
    <line x1="290" y1="210" x2="290" y2="310" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <line x1="320" y1="210" x2="320" y2="310" stroke="#22C55E" stroke-width="14" stroke-linecap="round"/>
    <line x1="350" y1="210" x2="350" y2="310" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Detalle 'K' estilizada en el lateral -->
    <path d="M 370 210 L 415 260 M 415 260 L 370 310" 
          fill="none" stroke="#10B981" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Ruedas -->
    <circle cx="200" cy="385" r="22" fill="#10B981"/>
    <circle cx="350" cy="385" r="22" fill="#10B981"/>
  </g>
</svg>
