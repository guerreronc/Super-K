<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SUPER-K</title>
    <base href="/" />
    
    <link rel="stylesheet" href="css/app.css" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app">
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; background:#020617; color:#10b981;">
            <img src="icon.svg" style="width:50px; height:50px; margin-bottom:12px;" alt="SUPER-K" />
            <h2 style="font-family:sans-serif;">SUPER-K</h2>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;">
        Ocurrió un error inesperado.
    </div>

    <!-- Librerías JS -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- CDN de Quagga2 -->
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
    <script src="js/scanner.js"></script>

   <!-- Interop para Blazor (Escáner Quagga Modal y Captura de Evidencias) -->
    <script>
        // Invoca el mismo scanner modal que usa Despensa
        window.iniciarScannerJS = async function () {
            if (typeof window.ejecutarEscaneoQuagga === 'function') {
                return await window.ejecutarEscaneoQuagga();
            }
            if (typeof window.abrirEscanerModal === 'function') {
                return await window.abrirEscanerModal();
            }
            return null;
        };

        // Abre la cámara del dispositivo para la evidencia
        window.capturarFotoEvidenciaJS = () => {
            return new Promise((resolve) => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                // 'environment' fuerza la cámara trasera en dispositivos móviles
                input.setAttribute('capture', 'environment'); 

                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (!file) {
                        resolve(null);
                        return;
                    }

                    // Convierte la foto a Base64 para guardarla directamente en el estado del item
                    const reader = new FileReader();
                    reader.onload = (evt) => resolve(evt.target.result);
                    reader.onerror = () => resolve(null);
                    reader.readAsDataURL(file);
                };

                // En caso de que el usuario cancele la selección
                window.addEventListener('focus', () => {
                    setTimeout(() => {
                        if (!input.files || input.files.length === 0) {
                            resolve(null);
                        }
                    }, 500);
                }, { once: true });

                input.click();
            });
            window.descargarArchivoJson = (nombreArchivo, base64Data) => {
                const link = document.createElement('a');
                link.download = nombreArchivo;
                link.href = 'data:application/json;base64,' + base64Data;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };
        };
    </script>

    <!-- Motor Blazor -->
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- SCRIPT DE LIMPIEZA -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                    console.log('ServiceWorker viejo eliminado con éxito.');
                }
            });
        }
    </script>
</body>

</html>
