<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SUPER-K</title>
    <base href="/" />
    
    <link rel="stylesheet" href="css/app.css" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="icon" type="image/png" href="icon-192.png" />

    <style>
        .splash-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #020617;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .splash-hidden {
            opacity: 0;
            visibility: hidden;
        }

        .splash-logo {
            width: 105px;
            height: 105px;
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.35);
            -webkit-animation: splashPop 0.7s ease-out forwards;
            animation: splashPop 1.3s ease-out forwards;
        }

        .splash-title {
            color: #10b981;
            font-size: 2.2rem;
            font-weight: 800;
            margin-top: 18px;
            margin-bottom: 0;
            letter-spacing: 3px;
            -webkit-animation: splashFade 0.8s ease-out forwards;
            animation: splashFade 0.8s ease-out forwards;
        }

        .splash-subtitle {
            color: #64748b;
            font-size: 0.95rem;
            margin-top: 6px;
            -webkit-animation: splashFade 2.0s ease-out forwards;
            animation: splashFade 2.3s ease-out forwards;
        }

        @-webkit-keyframes splashPop {
            0% { opacity: 0; -webkit-transform: scale(0.6); }
            100% { opacity: 1; -webkit-transform: scale(1); }
        }
        @keyframes splashPop {
            0% { opacity: 0; transform: scale(0.6); }
            100% { opacity: 1; transform: scale(1); }
        }

        @-webkit-keyframes splashFade {
            0% { opacity: 0; -webkit-transform: translateY(12px); }
            100% { opacity: 1; -webkit-transform: translateY(0); }
        }
        @keyframes splashFade {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
    <!-- 1. Única pantalla de carga -->
    <div id="splash-screen" class="splash-container">
        <img src="icon-192.png" class="splash-logo" alt="SUPER-K" />
        <h1 class="splash-title">SUPER-K</h1>
        <p class="splash-subtitle">Cargando tu despensa...</p>
    </div>

    <!-- 2. Contenedor de Blazor -->
    <div id="app"></div>

    <div id="blazor-error-ui" style="display:none;">
        Ocurrió un error inesperado.
    </div>

    <!-- Librerías JS -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
    <script src="js/scanner.js"></script>

    <!-- Interop para Blazor -->
    <script>
        window.iniciarScannerJS = async function () {
            if (typeof window.ejecutarEscaneoQuagga === 'function') {
                return await window.ejecutarEscaneoQuagga();
            }
            if (typeof window.abrirEscanerModal === 'function') {
                return await window.abrirEscanerModal();
            }
            return null;
        };

        window.capturarFotoEvidenciaJS = () => {
            return new Promise((resolve) => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.setAttribute('capture', 'environment'); 

                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (!file) {
                        resolve(null);
                        return;
                    }

                    const reader = new FileReader();
                    reader.onload = (evt) => resolve(evt.target.result);
                    reader.onerror = () => resolve(null);
                    reader.readAsDataURL(file);
                };

                window.addEventListener('focus', () => {
                    setTimeout(() => {
                        if (!input.files || input.files.length === 0) {
                            resolve(null);
                        }
                    }, 500);
                }, { once: true });

                input.click();
            });
        };

        window.descargarArchivoJson = (nombreArchivo, base64Data) => {
            const link = document.createElement('a');
            link.download = nombreArchivo;
            link.href = 'data:application/json;base64,' + base64Data;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    </script>

    <!-- ARRANQUE PARALELO Y SEGURO DE BLAZOR -->
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        (function() {
            const tiempoMinimo = 2500; // 2.5 segundos exactos
            
            const promesaTiempo = new Promise(resolve => setTimeout(resolve, tiempoMinimo));
            const promesaBlazor = Blazor.start();

            Promise.all([promesaBlazor, promesaTiempo]).then(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.classList.add('splash-hidden');
                    setTimeout(() => splash.remove(), 500);
                }
            }).catch(err => {
                console.error('Error al iniciar Blazor:', err);
                const splash = document.getElementById('splash-screen');
                if (splash) splash.remove();
            });
        })();
    </script>

    <!-- SCRIPT DE LIMPIEZA -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                    console.log('ServiceWorker viejo eliminado con éxito.');
                }
            });
        }
    </script>
</body>

</html>
