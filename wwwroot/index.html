<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SUPER-K</title>
    <base href="/" />
    
    <link rel="stylesheet" href="css/app.css" />
    <!-- Estilos aislados de Blazor (coincide con el nombre de la app) -->
    <link href="App SUPER-K.styles.css" rel="stylesheet" />
    
    <!-- Manifest PWA estándar -->
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app">
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; background:#020617; color:#10b981;">
            <img src="icon.svg" style="width:50px; height:50px; margin-bottom:12px;" alt="SUPER-K" />
            <h2 style="font-family:sans-serif;">SUPER-K</h2>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;">
        Ocurrió un error inesperado.
    </div>

    <!-- Librerías de escáner -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="js/scanner.js"></script>

    <!-- Engine principal Blazor -->
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- Registro del Service Worker estilo CERO-K (Evita problemas de caché en Vercel) -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });
        }
    </script>
</body>

</html>
